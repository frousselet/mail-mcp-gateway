[project]
name = "mail-mcp-gateway"
version = "0.1.0"
description = "Multi-user MCP gateway that connects any mailbox (IMAP/SMTP) to an AI agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp[cli]>=2.2.0,<3",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.0.0",
    "webauthn>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "asgi-lifespan>=2.1.0",
]

[project.scripts]
mail-mcp = "mail_mcp.server:main"
mail-mcp-web = "mail_mcp.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mail_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "B008",    # FastMCP-style defaults in tool signatures
    "SIM105",  # contextlib.suppress reads worse in the teardown paths here
]

[tool.ruff.lint.per-file-ignores]
# ui.py holds HTML/JS templates; rewrapping them hurts more than it helps.
"src/mail_mcp/ui.py" = ["E501"]
"tests/*" = ["E501"]
